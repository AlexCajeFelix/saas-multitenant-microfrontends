# Gateway unico: reproduz os caminhos que o supabase-js espera encontrar.
server {
    listen 8000;
    server_name _;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # GoTrue: /auth/v1/signup, /auth/v1/token, /auth/v1/admin/users, ...
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
    }

    # PostgREST: /rest/v1/<tabela>, /rest/v1/rpc/<funcao>
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
    }

    # Edge Functions: /functions/v1/<modulo>/<rota>
    location /functions/v1/ {
        proxy_pass http://functions:9000/;
    }
}
