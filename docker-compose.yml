# ===========================================================================
# Stack Supabase local, sem o CLI. Tudo atras de um gateway unico na 8000,
# que e o SUPABASE_URL usado tanto pelo cliente externo quanto pelas funcoes.
# ===========================================================================
name: saas-multitenant

services:
  db:
    image: supabase/postgres:15.8.1.060
    container_name: saas_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  # GoTrue sobe antes das migrations porque e ele quem cria auth.users,
  # tabela referenciada por core.memberships.
  auth:
    image: supabase/gotrue:v2.177.0
    container_name: saas_auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable&search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Executado sob demanda: `docker compose run --rm migrate`
  migrate:
    image: postgres:16-alpine
    container_name: saas_migrate
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase:/supabase:ro
      - ./docker/db:/opt/db:ro
    entrypoint: ["/bin/sh", "/opt/db/migrate.sh"]

  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: saas_rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://app_authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,core,iam,crm,projects,billing
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_LOG_LEVEL: info

  functions:
    image: supabase/edge-runtime:v1.69.12
    container_name: saas_functions
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Do lado de dentro da rede as funcoes falam com o proprio gateway
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      VERIFY_JWT: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
    command:
      - start
      - --main-service
      - /home/deno/functions/main
      - --port
      - "9000"

  gateway:
    image: nginx:1.27-alpine
    container_name: saas_gateway
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - functions
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
