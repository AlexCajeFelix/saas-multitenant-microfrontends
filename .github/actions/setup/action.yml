name: Setup
description: Node, pnpm e dependencias do monorepo, com cache.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
